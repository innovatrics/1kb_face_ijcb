[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face1kb"
version = "2.0.0"
description = "Sub-1 kB identity-preserving face compression: the face1kb-FAST and face1kb-ACCURATE codecs and the reproduction code of the extended study"
readme = "README.md"
requires-python = ">=3.10"
# The code is MIT-licensed, except the vendored EdgeFace architecture code in
# face1kb/third_party/edgeface (BSD-3-Clause, its LICENSE is shipped). The released
# model weights in weights/ are not part of the package and not covered by these
# licences: they are released under CC BY-NC-SA 4.0 (see weights/LICENSE and
# weights/README.md).
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "face1kb/third_party/edgeface/LICENSE"]
authors = [{ name = "Petr Hurtik" }, { name = "Jakub Sochor" }]
keywords = ["face recognition", "image compression", "learned compression", "biometrics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core: everything needed to load the codecs and encode / decode.
# compressai and timm are pinned: the bitstreams depend on compressai's entropy-coder
# implementation, and the EdgeFace anchor's parameter names come from timm.
# torch is bounded to the CUDA 12.8 line: the PyPI Linux wheels of torch >= 2.11 are
# CUDA 13 builds that need an NVIDIA driver >= 580, and the paper bitstreams were
# verified with torch 2.10.0 (CUDA 12.8), which this bound resolves to.
# compressai 1.2.8 declares numpy<2, so a resolved install gets numpy 1.26 (and
# opencv-python-headless 4.11); the paper environment ran numpy 2.4.6 and opencv
# 4.13 by installing requirements/paper.txt with --no-deps.
dependencies = [
    "torch>=2.4,<2.11",
    "torchvision>=0.19,<0.26",
    "compressai==1.2.8",
    "timm==1.0.24",
    "numpy>=1.26",
    "pillow>=10.0",
    "safetensors>=0.4",
    "tqdm>=4.66",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Classical baseline codecs (JPEG, JPEG 2000, WebP and AVIF come with Pillow >= 12).
# Pinned: the bitstreams depend on the codec libraries bundled in these wheels
# (libjpeg-turbo, OpenJPEG, libwebp, libavif/aom, libheif/x265, libjxl), and the
# paper's classical bitstreams are byte-identical only with these versions.
codecs = [
    "pillow==12.2.0",
    "pillow-heif==1.4.0",
    "pillow-jxl-plugin==1.3.7",
]
# Runtime dependencies of the JPEG-AI reference software (scripts/setup_jpegai.sh);
# pybind11 builds its two entropy-coder libraries.
jpegai = [
    "GPUtil==1.4.0",
    "addict==2.4.0",
    "einops==0.8.2",
    "ptflops==0.7.5",
    "commentjson==0.9.0",
    "pyrtools==1.0.10",
    "prettytable==3.18.0",
    "pynvml==11.5.3",
    "psutil==7.2.2",
    "pytorch-msssim==1.0.0",
    "opencv-python-headless>=4.9",
    "pybind11==3.0.4",
]
# Face-recognition evaluators, verification metrics and image-quality metrics.
eval = [
    "onnxruntime-gpu==1.23.2",
    "insightface==1.0.1",
    "lpips==0.1.4",
    "pytorch-msssim==1.0.0",
    "piq==0.8.0",
    # pyiqa depends on openai-clip, which imports pkg_resources (removed in
    # setuptools 82).
    "pyiqa==0.1.15.post2",
    "openai-clip==1.0.1",
    "setuptools<82",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "huggingface_hub>=0.23",
    "transformers>=4.40",
    "omegaconf>=2.3",
    "easydict>=1.10",
    "fvcore>=0.1.5.post20221221",
    "gdown>=5.0",
]
# Pre-compression preprocessing operators. kornia and einops are imported by the
# pinned BiRefNet remote code (kornia's laplacian runs only in training mode, so the
# kornia version does not change the eval-mode masks; kornia 0.8.3 needs Python 3.11). MediaPipe (selfie segmenter) must be installed
# separately with `pip install --no-deps mediapipe==0.10.35 sounddevice==0.5.5`, see
# scripts/setup_env.sh. Attribute estimation also needs the `eval` extra
# (insightface, onnxruntime-gpu) and, for the Monk Skin Tone estimate, `mst`.
preprocess = [
    "transformers>=4.40",
    "opencv-python-headless>=4.9",
    "kornia==0.8.3; python_version >= '3.11'",
    "kornia==0.8.2; python_version < '3.11'",
    "einops==0.8.2",
]
# Monk Skin Tone estimate of the KK attributes (skin-tone-classifier, GPL-3.0; kept
# in its own extra so that the other extras pull in no GPL code).
mst = [
    "skin-tone-classifier==1.2.6",
]
# Adversarial study: OpenAI CLIP as the PyPI distribution openai-clip 1.0.1, the one
# the paper environment used (it is also the distribution pyiqa requires; a second,
# git-installed `clip` distribution would overwrite the same top-level package).
# Its ViT-B/32 code path is identical to github.com/openai/CLIP at commit
# ded190a052fdf4585bd685cee5bc96e0310d2c93. It imports pkg_resources, which
# setuptools 82 removed.
adversarial = [
    "openai-clip==1.0.1",
    "setuptools<82",
    "ftfy>=6.1",
    "regex>=2023.0",
    "opencv-python-headless>=4.9",
]
# Codec training.
train = [
    "datasets>=2.19",
    "lpips==0.1.4",
    "pytorch-msssim==1.0.0",
]
dev = [
    "pytest>=7.4",
    "ruff==0.9.2",
    # builds the identity graphs of the ONNX-hook tests (tests/fr/test_onnx_hook.py)
    "onnx>=1.16",
]

[project.urls]
Repository = "https://github.com/innovatrics/1kb_face_ijcb"

[project.scripts]
face1kb-codec = "face1kb.codec.cli:main"

[tool.setuptools.packages.find]
include = ["face1kb*"]

[tool.setuptools.package-data]
"face1kb.third_party.edgeface" = ["LICENSE", "README.md"]
"face1kb.baselines" = ["data/*.txt"]

# ----------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 88
target-version = "py310"
# Vendored third-party code is kept verbatim.
extend-exclude = ["face1kb/third_party/edgeface", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = [
    "B905",  # zip() without strict=: keep the original semantics
    "UP038",  # isinstance with a tuple is fine (rule deprecated upstream)
    "D105",  # magic methods need no docstring
    "D107",  # parameters are documented in the class docstring (numpy style)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["face1kb"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["D", "B011"]
"experiments/**" = ["D100", "D101", "D102", "D103", "D104", "E402"]
"scripts/**" = ["D100", "D103"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "gpu: needs a CUDA GPU (skipped without one)",
    "data: needs the datasets under FACE1KB_DATA_ROOT / FACE1KB_WORK_ROOT (skipped otherwise)",
    "weights: needs the released weights in weights/ (run `git lfs pull`; skipped otherwise)",
]
